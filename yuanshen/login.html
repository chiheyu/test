<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录与注册</title>
    <style type="text/css">
        body {
            background-image: url('images/image.png'); /* 请替换为实际的背景图路径 */
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .social-login {
            text-align: center;
            margin-top: 20px;
        }

        .social-login button {
            background-color: #28a745;
            margin-top: 10px;
        }

        .social-login button:hover {
            background-color: #218838;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .toggle {
            text-align: center;
            margin-top: 10px;
        }

        .toggle a {
            color: #007BFF;
            text-decoration: none;
        }

        .toggle a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function validateLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (username === '') {
                errorDiv.textContent = '请填写用户名，用户名最大长度12字符';
                return false;
            } else if (username.length > 12) {
                errorDiv.textContent = '用户名最大长度12字符';
                return false;
            }

            if (password === '') {
                errorDiv.textContent = '请填写密码';
                return false;
            }

            errorDiv.textContent = '';
            return true;
        }

        function validateRegister() {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const errorDiv = document.getElementById('registerError');

            if (username === '') {
                errorDiv.textContent = '请填写用户名，用户名最大长度12字符';
                return false;
            } else if (username.length > 12) {
                errorDiv.textContent = '用户名最大长度12字符';
                return false;
            }

            if (password === '') {
                errorDiv.textContent = '请填写密码';
                return false;
            }

            errorDiv.textContent = '';
            return true;
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    </script>
</head>

<body>
    <div class="container">
        <div id="loginForm">
            <h2>登录</h2>
            <div class="error" id="loginError"></div>
            <form onsubmit="return validateLogin();">
                <input type="text" id="loginUsername" placeholder="用户名">
                <input type="password" id="loginPassword" placeholder="密码">
                <button type="submit">登录</button>
            </form>
            <div class="social-login">
                <button>第三方社交程序登录</button>
            </div>
            <div class="toggle">
                还没有账号？<a href="#" onclick="showRegister(); return false;">注册</a>
            </div>
        </div>
        <div id="registerForm" style="display: none;">
            <h2>注册</h2>
            <div class="error" id="registerError"></div>
            <form onsubmit="return validateRegister();">
                <input type="text" id="registerUsername" placeholder="用户名">
                <input type="password" id="registerPassword" placeholder="密码">
                <button type="submit">注册</button>
            </form>
            <div class="toggle">
                已有账号？<a href="#" onclick="showLogin(); return false;">登录</a>
            </div>
        </div>
    </div>
</body>

</html>
