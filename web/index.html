<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>定位测试</title>
</head>
<body>
  <h2>爱我吗，宝子</h2>
  <button onclick="getLocation()">爱</button>
  <button>不爱</button>
  <p id="output"></p >

  <script>
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(showPosition, showError);
    } else {
      document.getElementById("output").innerHTML = "你的浏览器不支持定位 API";
    }
  }

  function showPosition(position) {
    document.getElementById("output").innerHTML =
      "纬度: " + position.coords.latitude +
      "<br>经度: " + position.coords.longitude +
      "<br>精度: " + position.coords.accuracy + " 米";
  }

  function showError(error) {
    switch(error.code) {
      case error.PERMISSION_DENIED:
        document.getElementById("output").innerHTML = "❌ 你拒绝了定位请求";
        break;
      case error.POSITION_UNAVAILABLE:
        document.getElementById("output").innerHTML = "📡 定位信息不可用";
        break;
      case error.TIMEOUT:
        document.getElementById("output").innerHTML = "⌛ 定位请求超时";
        break;
      default:
        document.getElementById("output").innerHTML = "⚠️ 未知错误";
        break;
    }
  }
  </script>
</body>
</html>
